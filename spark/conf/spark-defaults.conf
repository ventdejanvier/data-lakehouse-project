# spark-defaults.conf
# Lưu file này tại: ./spark/conf/spark-defaults.conf

# =====  CẤU HÌNH CHUNG =====
spark.driver.host 0.0.0.0
spark.driver.bindAddress 0.0.0.0
spark.driver.port 7001

# ===== EXECUTOR VÀ DRIVER MEMORY =====
# Điều chỉnh theo máy của bạn 
spark.driver.memory 2g
spark.executor.memory 512m
spark.executor.cores 2

# ===== STANDALONE MODE =====
spark.master spark://spark-master:7077

# ===== NETWORK & TIMEOUT =====
spark.network.timeout 300s
spark.executor.heartbeatInterval 10s

# ===== S3 / MinIO Configuration =====
# Để Spark có thể ghi/đọc từ MinIO
spark.hadoop.fs.s3a.endpoint http://minio:9000
spark.hadoop.fs.s3a.access.key minioadmin
spark.hadoop.fs.s3a.secret.key minioadmin
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.connection.ssl.enabled false

# ===== LOGGING =====
spark.eventLog.enabled true
spark.eventLog.dir /opt/spark/logs
spark.history.fs.logDirectory /opt/spark/logs

# ===== PYTHON (nếu sử dụng PySpark) =====
spark.pyspark.python /usr/bin/python3
spark.pyspark.driver.python /usr/bin/python3

# ===== SHUFFLE VÀ PERFORMANCE =====
spark.shuffle.compress true
spark.shuffle.spill.compress true
spark.rdd.compress true
spark.shuffle.service.enabled false

# ===== SQL CONFIG =====
spark.sql.adaptive.enabled true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.adaptive.skewJoin.enabled true

spark.sql.warehouse.dir s3a://silver/ 
